<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BattleBots 2026-1 hero image</title>
  <desc id="desc">Banner profesional para el proyecto de robótica BattleBots UDD EIRI, con robot estilizado, control Wi-Fi y detalles de PCB.</desc>
  <defs>
